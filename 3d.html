    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: #fff; }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        canvas { display: block; }

        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-title {
            font-family: 'Cinzel', serif; font-size: clamp(2rem, 6vw, 4rem);
            color: #9B4DCA; text-shadow: 0 0 40px rgba(123, 45, 142, 0.6);
            letter-spacing: 0.15em; margin-bottom: 2rem;
        }
        .loading-sub {
            font-size: 0.9rem; color: #9A9A9A; letter-spacing: 0.2em;
            text-transform: uppercase; margin-bottom: 1.5rem;
        }
        .loading-bar {
            width: 200px; height: 2px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }
        .loading-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #7B2D8E, #9B4DCA);
            transition: width 0.3s ease;
        }

        /* HUD */
        #hud {
            position: fixed; inset: 0; z-index: 10; pointer-events: none;
            opacity: 0; transition: opacity 1s ease;
        }
        #hud.visible { opacity: 1; }
        .hud-top-left {
            position: absolute; top: 1.5rem; left: 1.5rem;
            font-family: 'Cinzel', serif; font-size: 0.85rem;
            letter-spacing: 0.15em; color: rgba(255,255,255,0.7);
        }
        .hud-top-right {
            position: absolute; top: 1.5rem; right: 1.5rem;
            pointer-events: all;
        }
        .back-btn {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(123,45,142,0.4);
            color: #9B4DCA; padding: 0.5rem 1.2rem; border-radius: 6px;
            font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.1em;
            cursor: pointer; text-decoration: none; display: inline-block;
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(123,45,142,0.2); border-color: #9B4DCA;
            color: #fff;
        }
        .hud-bottom {
            position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            text-align: center;
        }
        .interaction-hint {
            font-size: 0.75rem; color: rgba(255,255,255,0.5);
            letter-spacing: 0.15em; text-transform: uppercase;
            opacity: 0; transition: opacity 0.5s ease;
        }
        .interaction-hint.visible { opacity: 1; }
        .hud-name {
            position: absolute; bottom: 1.5rem; left: 1.5rem;
            font-family: 'Cinzel', serif; font-size: 0.7rem;
            letter-spacing: 0.2em; color: rgba(255,255,255,0.3);
        }
        .hud-controls {
            position: absolute; bottom: 1.5rem; right: 1.5rem;
            font-size: 0.65rem; color: rgba(255,255,255,0.3);
            text-align: right; line-height: 1.6;
        }

        /* Info Overlay */
        #info-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: all 0.5s ease;
        }
        #info-overlay.visible { opacity: 1; visibility: visible; pointer-events: all; }
        .info-panel {
            background: rgba(10,10,10,0.95); border: 1px solid rgba(123,45,142,0.3);
            border-radius: 16px; padding: 2.5rem; max-width: 520px; width: 90%;
            max-height: 80vh; overflow-y: auto; position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(123,45,142,0.1);
        }
        .info-panel h2 {
            font-family: 'Cinzel', serif; font-size: 1.5rem;
            color: #9B4DCA; margin-bottom: 1rem; letter-spacing: 0.05em;
        }
        .info-panel p, .info-panel li {
            font-size: 0.9rem; color: #D0D0D0; line-height: 1.7; margin-bottom: 0.5rem;
        }
        .info-panel ul { list-style: none; padding: 0; }
        .info-panel li { padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-panel li::before { content: '▸ '; color: #9B4DCA; }
        .info-close {
            position: absolute; top: 1rem; right: 1rem;
            background: none; border: 1px solid rgba(255,255,255,0.2);
            color: #fff; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-size: 1rem; display: flex;
            align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .info-close:hover { border-color: #9B4DCA; color: #9B4DCA; }
        .info-link {
            display: inline-block; margin-top: 1rem; padding: 0.5rem 1.2rem;
            background: rgba(123,45,142,0.2); border: 1px solid rgba(123,45,142,0.4);
            color: #9B4DCA; text-decoration: none; border-radius: 8px;
            font-size: 0.85rem; transition: all 0.3s ease;
        }
        .info-link:hover { background: rgba(123,45,142,0.4); color: #fff; }

        /* Intro Title */
        #intro-title {
            position: fixed; inset: 0; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; opacity: 0;
            transition: opacity 2s ease;
        }
        #intro-title.visible { opacity: 1; }
        #intro-title.fade { opacity: 0; }
        .intro-text {
            font-family: 'Cinzel', serif; font-size: clamp(1.5rem, 5vw, 3.5rem);
            color: #fff; text-shadow: 0 0 60px rgba(123,45,142,0.5);
            letter-spacing: 0.2em; text-align: center;
        }

        /* Audio Toggle */
        #audio-toggle {
            position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 20; pointer-events: all;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(123,45,142,0.3);
            color: #9B4DCA; padding: 0.4rem 1rem; border-radius: 20px;
            font-size: 0.75rem; cursor: pointer; backdrop-filter: blur(10px);
            opacity: 0; transition: opacity 1s ease;
        }
        #audio-toggle.visible { opacity: 1; }
        #audio-toggle:hover { background: rgba(123,45,142,0.2); }

        /* Responsive */
        @media (max-width: 768px) {
            .info-panel { padding: 1.5rem; }
            .hud-controls { display: none; }
        }
    </style>
</head>

                content: `

        // ===== GLOBALS =====
        let scene, camera, renderer, clock;
        let crow, crowGroup;
        let locations = [];
        let particles;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        let audioContext, audioEnabled = false;
        let ambientSound, windSound;
        let currentInfo = null;
        let introComplete = false;
        let nearLocation = null;

        // ===== INIT =====
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0008);
            scene.background = new THREE.Color(0x000005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 30, 80);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.8;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            createLights();
            createEnvironment();
            createCrow();
            createParticles();
            createLocations();

            window.addEventListener('resize', onResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onClick);
            document.addEventListener('mousemove', onMouseMove);

            simulateLoading();
        }

        // ===== LOADING =====
        function simulateLoading() {
            const fill = document.getElementById('loading-fill');
            const text = document.getElementById('loading-text');
            const steps = [
                { pct: 20, msg: 'Loading world...' },
                { pct: 45, msg: 'Summoning raven...' },
                { pct: 70, msg: 'Entering the abyss...' },
                { pct: 90, msg: 'Preparing flight...' },
                { pct: 100, msg: 'Welcome.' }
            ];
            let i = 0;
            const interval = setInterval(() => {
                if (i < steps.length) {
                    fill.style.width = steps[i].pct + '%';
                    text.textContent = steps[i].msg;
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(startIntro, 500);
                }
            }, 400);
        }

        function startIntro() {
            document.getElementById('loading-screen').classList.add('hidden');
            const introTitle = document.getElementById('intro-title');
            introTitle.classList.add('visible');
            setTimeout(() => {
                introTitle.classList.add('fade');
                document.getElementById('hud').classList.add('visible');
                document.getElementById('audio-toggle').classList.add('visible');
                introComplete = true;
            }, 3000);
        }

        // ===== LIGHTS =====
        function createLights() {
            const ambient = new THREE.AmbientLight(0x111122, 0.3);
            scene.add(ambient);

            const moon = new THREE.DirectionalLight(0x4444aa, 0.6);
            moon.position.set(50, 100, 30);
            moon.castShadow = true;
            moon.shadow.mapSize.width = 2048;
            moon.shadow.mapSize.height = 2048;
            moon.shadow.camera.near = 0.5;
            moon.shadow.camera.far = 500;
            moon.shadow.camera.left = -100;
            moon.shadow.camera.right = 100;
            moon.shadow.camera.top = 100;
            moon.shadow.camera.bottom = -100;
            scene.add(moon);

            const pointLight1 = new THREE.PointLight(0x7B2D8E, 1, 200);
            pointLight1.position.set(-30, 20, -30);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x9B1B30, 0.8, 150);
            pointLight2.position.set(40, 15, -50);
            scene.add(pointLight2);
        }

        // ===== ENVIRONMENT =====
        function createEnvironment() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(2000, 2000, 100, 100);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x050508,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -20;
            ground.receiveShadow = true;
            scene.add(ground);

            // Moon
            const moonGeo = new THREE.SphereGeometry(15, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({ color: 0x6666aa });
            const moonMesh = new THREE.Mesh(moonGeo, moonMat);
            moonMesh.position.set(80, 120, -300);
            scene.add(moonMesh);

            // Moon glow
            const glowGeo = new THREE.SphereGeometry(25, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x4444aa,
                transparent: true,
                opacity: 0.15
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.copy(moonMesh.position);
            scene.add(glow);

            // Ruins / Structures
            createRuins();
            createMountains();
        }

        function createRuins() {
            const ruinMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0f,
                roughness: 0.8,
                metalness: 0.2
            });

            for (let i = 0; i < 40; i++) {
                const w = 5 + Math.random() * 15;
                const h = 10 + Math.random() * 40;
                const d = 5 + Math.random() * 15;
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, ruinMat);

                const angle = Math.random() * Math.PI * 2;
                const radius = 80 + Math.random() * 300;
                mesh.position.set(
                    Math.cos(angle) * radius,
                    h / 2 - 20,
                    Math.sin(angle) * radius
                );
                mesh.rotation.y = Math.random() * Math.PI;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            }

            // Pillars
            for (let i = 0; i < 20; i++) {
                const h = 15 + Math.random() * 30;
                const geo = new THREE.CylinderGeometry(1.5, 2, h, 8);
                const mesh = new THREE.Mesh(geo, ruinMat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 100 + Math.random() * 250;
                mesh.position.set(
                    Math.cos(angle) * radius,
                    h / 2 - 20,
                    Math.sin(angle) * radius
                );
                mesh.castShadow = true;
                scene.add(mesh);
            }
        }

        function createMountains() {
            const mountainMat = new THREE.MeshStandardMaterial({
                color: 0x08080c,
                roughness: 1,
                metalness: 0
            });

            for (let i = 0; i < 15; i++) {
                const h = 60 + Math.random() * 120;
                const geo = new THREE.ConeGeometry(40 + Math.random() * 60, h, 6);
                const mesh = new THREE.Mesh(geo, mountainMat);
                const angle = (i / 15) * Math.PI * 2;
                const radius = 400 + Math.random() * 200;
                mesh.position.set(
                    Math.cos(angle) * radius,
                    h / 2 - 20,
                    Math.sin(angle) * radius
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            }
        }

        // ===== CROW =====
        function createCrow() {
            crowGroup = new THREE.Group();

            const bodyGeo = new THREE.SphereGeometry(2, 8, 8);
            bodyGeo.scale(1, 0.6, 2);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x000000,
                roughness: 0.9,
                metalness: 0.1
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            crowGroup.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(1, 8, 8);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 0.8, 2);
            head.castShadow = true;
            crowGroup.add(head);

            // Beak
            const beakGeo = new THREE.ConeGeometry(0.3, 1.2, 6);
            const beakMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
            const beak = new THREE.Mesh(beakGeo, beakMat);
            beak.position.set(0, 0.8, 3.2);
            beak.rotation.x = Math.PI / 2;
            crowGroup.add(beak);

            // Wings
            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0);
            wingShape.quadraticCurveTo(4, 2, 8, -1);
            wingShape.quadraticCurveTo(4, -1, 0, 0);

            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.1, bevelEnabled: false });
            const wingMat = new THREE.MeshStandardMaterial({
                color: 0x000000,
                roughness: 0.9,
                side: THREE.DoubleSide
            });

            const leftWing = new THREE.Mesh(wingGeo, wingMat);
            leftWing.position.set(-1.8, 0.2, 0);
            leftWing.name = 'leftWing';
            crowGroup.add(leftWing);

            const rightWing = new THREE.Mesh(wingGeo, wingMat);
            rightWing.position.set(1.8, 0.2, 0);
            rightWing.rotation.y = Math.PI;
            rightWing.name = 'rightWing';
            crowGroup.add(rightWing);

            // Tail
            const tailGeo = new THREE.BoxGeometry(0.2, 0.8, 2);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(0, 0.2, -2.5);
            tail.rotation.x = -0.3;
            crowGroup.add(tail);

            // Eyes (glowing)
            const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x9B1B30 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(0.5, 1, 2.5);
            crowGroup.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(-0.5, 1, 2.5);
            crowGroup.add(rightEye);

            crowGroup.position.set(0, 25, 0);
            crowGroup.scale.set(1.5, 1.5, 1.5);
            scene.add(crowGroup);
            crow = crowGroup;
        }

        function animateCrow(time) {
            if (!crow) return;

            // Wing flap
            const flapSpeed = 3;
            const flapAmount = 0.6;
            const leftWing = crow.getObjectByName('leftWing');
            const rightWing = crow.getObjectByName('rightWing');

            if (leftWing && rightWing) {
                const flap = Math.sin(time * flapSpeed) * flapAmount;
                leftWing.rotation.z = flap;
                rightWing.rotation.z = -flap;
            }

            // Gentle bobbing
            crow.position.y = 25 + Math.sin(time * 1.5) * 2;

            // Slow circling
            const circleRadius = 60;
            const circleSpeed = 0.1;
            crow.position.x = Math.cos(time * circleSpeed) * circleRadius;
            crow.position.z = Math.sin(time * circleSpeed) * circleRadius;
            crow.rotation.y = -time * circleSpeed + Math.PI / 2;

            // Banking
            const bank = Math.cos(time * circleSpeed) * 0.3;
            crow.rotation.z = bank;
        }

        // ===== PARTICLES =====
        function createParticles() {
            const count = 2000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 600;
                positions[i * 3 + 1] = Math.random() * 150 - 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 600;

                const c = new THREE.Color();
                c.setHSL(0.75 + Math.random() * 0.1, 0.5, 0.3 + Math.random() * 0.3);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);
        }

        // ===== LOCATIONS =====
        function createLocations() {
            const locationDefs = [
                {
                    id: 'about',
                    position: new THREE.Vector3(-60, 5, -40),
                    color: 0x9B4DCA,
                    scale: 12,
                    data: portfolioData.about
                },
                {
                    id: 'education',
                    position: new THREE.Vector3(50, 8, -60),
                    color: 0x9B1B30,
                    scale: 10,
                    data: portfolioData.education
                },
                {
                    id: 'skills',
                    position: new THREE.Vector3(-40, 3, 50),
                    color: 0x7B2D8E,
                    scale: 11,
                    data: portfolioData.skills
                },
                {
                    id: 'projects',
                    position: new THREE.Vector3(60, 6, 40),
                    color: 0xC4283F,
                    scale: 13,
                    data: portfolioData.projects
                },
                {
                    id: 'contact',
                    position: new THREE.Vector3(0, 4, -80),
                    color: 0x9B4DCA,
                    scale: 9,
                    data: portfolioData.contact
                },
                {
                    id: 'cv',
                    position: new THREE.Vector3(-70, 7, 20),
                    color: 0x7B2D8E,
                    scale: 8,
                    data: portfolioData.cv
                }
            ];

            locationDefs.forEach(def => {
                // Beacon
                const beaconGeo = new THREE.SphereGeometry(3, 16, 16);
                const beaconMat = new THREE.MeshBasicMaterial({
                    color: def.color,
                    transparent: true,
                    opacity: 0.8
                });
                const beacon = new THREE.Mesh(beaconGeo, beaconMat);
                beacon.position.copy(def.position);
                beacon.position.y += def.scale;
                scene.add(beacon);

                // Glow
                const glowGeo = new THREE.SphereGeometry(def.scale * 0.8, 16, 16);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: def.color,
                    transparent: true,
                    opacity: 0.1,
                    blending: THREE.AdditiveBlending
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.copy(beacon.position);
                scene.add(glow);

                // Light pillar
                const pillarGeo = new THREE.CylinderGeometry(0.5, 2, def.scale * 2, 8);
                const pillarMat = new THREE.MeshBasicMaterial({
                    color: def.color,
                    transparent: true,
                    opacity: 0.2
                });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.copy(def.position);
                pillar.position.y += def.scale;
                scene.add(pillar);

                // Label
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#9B4DCA';
                ctx.font = 'bold 48px Cinzel, serif';
                ctx.textAlign = 'center';
                ctx.fillText(def.data.title, 256, 70);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.copy(def.position);
                sprite.position.y += def.scale + 8;
                sprite.scale.set(25, 6, 1);
                scene.add(sprite);

                locations.push({
                    mesh: beacon,
                    glow: glow,
                    position: def.position.clone(),
                    radius: def.scale + 5,
                    data: def.data
                });
            });
        }

        // ===== CONTROLS =====
        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = true; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                case 'KeyD': case 'ArrowRight': moveRight = true; break;
                case 'KeyE':
                    if (nearLocation) showInfo(nearLocation.data);
                    break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = false; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                case 'KeyD': case 'ArrowRight': moveRight = false; break;
            }
        }

        function onClick(e) {
            if (!introComplete) return;
            if (e.target.closest('#info-overlay') || e.target.closest('#audio-toggle') || e.target.closest('.back-btn')) return;

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);

            const meshes = locations.map(l => l.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const loc = locations.find(l => l.mesh === intersects[0].object);
                if (loc) showInfo(loc.data);
            }
        }

        function onMouseMove(e) {
            // Camera look based on mouse
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;
            camera.rotation.y = -x * 0.3;
            camera.rotation.x = y * 0.15;
        }

        // ===== MOVEMENT =====
        function updateMovement(delta) {
            if (!introComplete) return;

            const speed = 40 * delta;
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) camera.position.z -= direction.z * speed;
            if (moveLeft || moveRight) camera.position.x += direction.x * speed;

            // Keep above ground
            camera.position.y = Math.max(15, camera.position.y);
        }

        // ===== INTERACTIONS =====
        function checkProximity() {
            if (!introComplete) return;
            const hint = document.getElementById('interaction-hint');
            let closest = null;
            let closestDist = Infinity;

            locations.forEach(loc => {
                const dist = camera.position.distanceTo(loc.position);
                if (dist < loc.radius && dist < closestDist) {
                    closestDist = dist;
                    closest = loc;
                }
            });

            if (closest !== nearLocation) {
                nearLocation = closest;
                if (nearLocation) {
                    hint.textContent = 'PRESS E OR CLICK TO EXPLORE';
                    hint.classList.add('visible');
                } else {
                    hint.classList.remove('visible');
                }
            }
        }

        function showInfo(data) {
            currentInfo = data;
            document.getElementById('info-content').innerHTML = '<h2>' + data.title + '</h2>' + data.content;
            document.getElementById('info-overlay').classList.add('visible');
        }

        window.closeInfo = function() {
            document.getElementById('info-overlay').classList.remove('visible');
            currentInfo = null;
        };

        // ===== AUDIO =====
        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Wind noise
            const bufferSize = audioContext.sampleRate * 2;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const noise = audioContext.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;

            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 400;

            const gain = audioContext.createGain();
            gain.gain.value = 0.03;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioContext.destination);
            noise.start();

            windSound = { source: noise, gain: gain, filter: filter };
        }

        document.getElementById('audio-toggle').addEventListener('click', () => {
            if (!audioContext) initAudio();
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-toggle');
            if (audioEnabled) {
                btn.textContent = '🔊 AUDIO';
                windSound.gain.gain.value = 0.04;
            } else {
                btn.textContent = '🔇 AUDIO';
                windSound.gain.gain.value = 0;
            }
        });

        // ===== RESIZE =====
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===== ANIMATION LOOP =====
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = Math.min(clock.getDelta(), 0.1);

            if (crow) animateCrow(time);

            if (particles) {
                particles.rotation.y += 0.0001;
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += Math.sin(time + i) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            updateMovement(delta);
            checkProximity();

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
